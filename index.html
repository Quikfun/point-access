<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Update 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Two+Tone" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.0/css/all.min.css" crossorigin="anonymous" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --yellow: #f5e642;
      --yellow-dark: #c9bc00;
      --bg: #1a1a1a;
      --text: #e8e8e8;
      --border: #333;
      --card: rgba(37, 37, 37, 0.95); /* ردينا الكارد شفافة شوية باش تبان الخلفية */
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Exo 2', sans-serif; overflow-x: hidden; }

    /* NEW DYNAMIC BACKGROUND SYSTEM */
    .bg-master {
        position: fixed;
        inset: 0;
        z-index: -1;
        /* حطينا التصويرة ديالك هنا */
        background-image: url('img/back1.jpg'); 
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }
    /* طبقة ضبابية غامقة باش الكتيبة تبان ناضية */
    .bg-overlay {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85));
        pointer-events: none;
    }

    /* PAGE STRUCTURE */
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 16px; opacity: 0; transition: opacity 0.5s ease 0.3s; }
    .page.visible { opacity: 1; }
    .site-header { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; text-align: center; }
    .site-header h1 { font-family: 'Rajdhani', sans-serif; font-size: clamp(24px, 6vw, 38px); font-weight: 700; color: var(--yellow); text-transform: uppercase; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }

    /* CARD DESIGN */
    .card { background: var(--card); border: 1px solid rgba(245,230,66,0.2); border-radius: 12px; padding: 32px 28px; width: 100%; max-width: 460px; position: relative; box-shadow: 0 10px 50px rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
    .step-badge { position: absolute; top: -16px; left: 28px; background: var(--yellow); color: #111; font-family: 'Rajdhani', sans-serif; font-weight: 700; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--yellow); }

    /* GIFT CARD FIX */
    .gift-card-visual { background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%); border: 1px solid rgba(245,230,66,0.2); border-radius: 14px; padding: 22px 24px; margin-bottom: 20px; }
    .code-row { display: flex; align-items: center; justify-content: center; gap: 5px; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 10px; font-family: 'Share Tech Mono', monospace; }
    
    @media (max-width: 480px) {
      .code-row { gap: 3px; padding: 8px 5px; }
      .code-segment, .code-dash, .code-hidden { font-size: 14px; letter-spacing: 1px; }
    }

    /* OGAds Frame */
    #ogadsFrame { width:100%; min-height:580px; border-radius:10px; border:none; background:transparent; }

    /* BUTTONS & INPUTS */
    .input-wrap { display: flex; align-items: center; gap: 10px; background: #111; border: 1px solid var(--border); border-radius: 8px; padding: 0 14px; margin-bottom: 10px; }
    .input-wrap input { flex: 1; background: none; border: none; outline: none; color: #fff; padding: 13px 0; }
    .proceed-btn { width: 100%; margin-top: 20px; padding: 15px; background: var(--yellow); color: #111; font-family: 'Rajdhani', sans-serif; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }

    /* LOADER */
    #loader { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity 0.7s ease; }
    #loader.fade-out { opacity: 0; pointer-events: none; }
    .loader-icon { font-size: 64px !important; color: var(--yellow); animation: spin 2s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    #step2, #step3 { display: none; }
  </style>
</head>
<body>

<div class="bg-master"></div>
<div class="bg-overlay"></div>

<div id="loader">
  <span class="material-icons-two-tone loader-icon">settings</span>
  <div style="width: 180px; height: 4px; background: #333; border-radius: 2px; overflow: hidden;">
    <div id="loaderBar" style="width: 0%; height: 100%; background: var(--yellow); transition: 2s ease;"></div>
  </div>
</div>

<div class="page" id="mainPage">
  <header class="site-header">
    <h1>Quik Rewards 2026</h1>
  </header>

  <div class="card" id="step1" style="display:block;">
    <div class="step-badge">1</div>
    <p style="font-size: 13px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 20px;">Verification Start</p>
    <div class="input-wrap">
      <span class="material-icons-two-tone" style="color:var(--yellow)">face</span>
      <input type="text" id="usernameInput" placeholder="Enter Roblox Username..." />
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px;">
        <div class="plat" style="background:#111; border:1px solid #333; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer;" data-p="PC"><i class="fab fa-windows"></i></div>
        <div class="plat" style="background:#111; border:1px solid #333; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer;" data-p="Xbox"><i class="fab fa-xbox"></i></div>
        <div class="plat" style="background:#111; border:1px solid #333; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer;" data-p="Android"><i class="fab fa-android"></i></div>
        <div class="plat" style="background:#111; border:1px solid #333; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer;" data-p="iOS"><i class="fab fa-apple"></i></div>
    </div>
    <button class="proceed-btn" id="proceedBtn">Connect Account</button>
  </div>

  <div class="card" id="step2">
    <div class="step-badge">2</div>
    <div style="text-align:center;">
        <h2 style="font-family:'Rajdhani'; color:var(--yellow);">Connecting...</h2>
        <p id="progressPct" style="font-size:32px; font-weight:bold; margin:15px 0;">0%</p>
        <div style="background:#111; height:8px; border-radius:4px; overflow:hidden;">
            <div id="progressBar" style="width:0%; height:100%; background:var(--yellow); transition:0.3s;"></div>
        </div>
    </div>
  </div>

  <div class="card" id="step3">
    <div class="step-badge">3</div>
    <div class="gift-card-visual">
      <div style="font-family:'Rajdhani'; font-weight:bold; letter-spacing:1px; margin-bottom:15px;">$25.00 ROBLOX CARD</div>
      <div class="code-row">
        <span>GHTR</span><span>-</span><span>HHGG</span><span>-</span><span>REEF</span><span>-</span><span id="seg1" style="color:rgba(255,255,255,0.2)">XXXX</span>
        <span class="material-icons-two-tone" id="lockIcon" style="margin-left:auto; font-size:18px; color:var(--yellow)">lock</span>
      </div>
    </div>
    <div id="lockerWrap">
        <div style="font-size:11px; text-align:center; margin-bottom:15px; color:var(--yellow); letter-spacing:1px;">VERIFY TO REVEAL LAST 4 DIGITS</div>
        <iframe id="ogadsFrame" src="https://quikfun.info/cl/i/qnnw94" scrolling="no"></iframe>
    </div>
  </div>
</div>

<script>
  setTimeout(() => { document.getElementById('loaderBar').style.width = '100%'; }, 50);
  setTimeout(() => {
    document.getElementById('loader').classList.add('fade-out');
    document.getElementById('mainPage').classList.add('visible');
  }, 2200);

  let platform = '';
  document.querySelectorAll('.plat').forEach(p => {
    p.onclick = () => {
      document.querySelectorAll('.plat').forEach(x => {x.style.borderColor = '#333'; x.style.color = '#fff';});
      p.style.borderColor = '#f5e642'; p.style.color = '#f5e642';
      platform = p.dataset.p;
    };
  });

  document.getElementById('proceedBtn').onclick = () => {
    if(!platform || !document.getElementById('usernameInput').value) return alert('Details needed');
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    let p = 0;
    let iv = setInterval(() => {
      p += Math.floor(Math.random() * 5) + 2;
      if(p > 100) p = 100;
      document.getElementById('progressBar').style.width = p + '%';
      document.getElementById('progressPct').innerText = p + '%';
      if(p >= 100) {
        clearInterval(iv);
        setTimeout(() => {
          document.getElementById('step2').style.display = 'none';
          document.getElementById('step3').style.display = 'block';
        }, 800);
      }
    }, 150);
  };

  window.addEventListener('message', function(e) {
    if (e.data === 'offerCompleted' || e.data === 'complete') {
      document.getElementById('seg1').innerText = '7X4Q';
      document.getElementById('seg1').style.color = '#f5e642';
      document.getElementById('lockIcon').innerText = 'lock_open';
      document.getElementById('lockerWrap').style.display = 'none';
    }
  });
</script>
</body>
</html>
