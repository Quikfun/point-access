<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robux Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* خلفية اللعبة المضببة */
        .bg-blur-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1605379399642-870262d3d051?ixlib=rb-1.2.1&auto=format&fit=crop&w=1080&q=80');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.3);
            z-index: -1;
            transform: scale(1.1);
        }

        /* أنيميشن الظهور التدريجي */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* أنيميشن النبض فمرحلة البحث */
        .pulse-logo {
            animation: pulseAnim 1.5s infinite;
        }
        @keyframes pulseAnim {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="antialiased text-white min-h-screen flex items-center justify-center relative font-sans overflow-hidden p-4">
    
    <div class="bg-blur-container"></div>

    <div class="bg-[#212121] w-full max-w-[340px] rounded-2xl shadow-2xl p-6 pb-8 border border-[#333333] z-10 transition-all duration-300">
        
        <div id="step-1" class="fade-in block">
            
            <div class="flex justify-center mb-5 mt-2 relative w-full h-10 overflow-hidden">
                <img src="https://i.ytimg.com/vi/n8Hpsy7xOLs/maxresdefault.jpg" alt="Roblox" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[250px] mix-blend-screen pointer-events-none">
            </div>
            
            <p class="text-[13px] text-gray-300 text-center mb-8 leading-snug px-1">
                Robux allows you to purshase upgrades for your avatar or buy special abilities in experiences
            </p>

            <div class="mb-5">
                <h3 class="text-white text-[16px] font-semibold text-center mb-3">Enter your Username</h3>
                <input type="text" id="username" placeholder="type your user ..." class="w-full bg-black border border-gray-600 rounded-xl px-4 py-3.5 text-white text-center text-[15px] focus:outline-none focus:border-[#00c86f] transition-colors placeholder-gray-500 font-medium">
            </div>

            <button onclick="goToSearch()" class="w-full bg-[#00c86f] hover:bg-[#00b060] text-white font-bold text-[16px] py-3.5 rounded-xl transition-colors shadow-lg mt-2">
                Continue
            </button>
        </div>

        <div id="step-2" class="fade-in hidden flex-col items-center justify-center py-8">
            <svg viewBox="0 0 512 512" class="w-20 h-20 fill-white mb-6 pulse-logo">
                 <path d="M103.5 0L0 408.5 408.5 512 512 103.5 103.5 0zm190 326c-38.6 9.8-77.8-13.6-87.6-52.2-9.8-38.6 13.6-77.8 52.2-87.6 38.6-9.8 77.8 13.6 87.6 52.2 9.8 38.6-13.6 77.8-52.2 87.6z"/>
            </svg>
            <p id="loading-text" class="text-gray-300 text-[15px] font-medium text-center">Searching ...</p>
        </div>

        <div id="step-3" class="fade-in hidden">
             <div class="flex justify-center mb-6 mt-2">
                 <svg viewBox="0 0 512 512" class="w-16 h-16 fill-white">
                    <path d="M103.5 0L0 408.5 408.5 512 512 103.5 103.5 0zm190 326c-38.6 9.8-77.8-13.6-87.6-52.2-9.8-38.6 13.6-77.8 52.2-87.6 38.6-9.8 77.8 13.6 87.6 52.2 9.8 38.6-13.6 77.8-52.2 87.6z"/>
                </svg>
            </div>
            
            <div class="space-y-3">
                <button onclick="generateAmount('1700')" class="w-full bg-[#00c86f] hover:bg-[#00b060] text-white font-bold text-[16px] py-3.5 rounded-xl transition-colors shadow-lg flex items-center justify-center">
                    <svg viewBox="0 0 512 512" class="w-5 h-5 fill-white mr-2"><path d="M103.5 0L0 408.5 408.5 512 512 103.5 103.5 0zm190 326c-38.6 9.8-77.8-13.6-87.6-52.2-9.8-38.6 13.6-77.8 52.2-87.6 38.6-9.8 77.8 13.6 87.6 52.2 9.8 38.6-13.6 77.8-52.2 87.6z"/></svg> 1700
                </button>
                <button onclick="generateAmount('4500')" class="w-full bg-[#00c86f] hover:bg-[#00b060] text-white font-bold text-[16px] py-3.5 rounded-xl transition-colors shadow-lg flex items-center justify-center">
                    <svg viewBox="0 0 512 512" class="w-5 h-5 fill-white mr-2"><path d="M103.5 0L0 408.5 408.5 512 512 103.5 103.5 0zm190 326c-38.6 9.8-77.8-13.6-87.6-52.2-9.8-38.6 13.6-77.8 52.2-87.6 38.6-9.8 77.8 13.6 87.6 52.2 9.8 38.6-13.6 77.8-52.2 87.6z"/></svg> 4500
                </button>
                <button onclick="generateAmount('10000')" class="w-full bg-[#00c86f] hover:bg-[#00b060] text-white font-bold text-[16px] py-3.5 rounded-xl transition-colors shadow-lg flex items-center justify-center">
                    <svg viewBox="0 0 512 512" class="w-5 h-5 fill-white mr-2"><path d="M103.5 0L0 408.5 408.5 512 512 103.5 103.5 0zm190 326c-38.6 9.8-77.8-13.6-87.6-52.2-9.8-38.6 13.6-77.8 52.2-87.6 38.6-9.8 77.8 13.6 87.6 52.2 9.8 38.6-13.6 77.8-52.2 87.6z"/></svg> 10 000
                </button>
                <button onclick="generateAmount('50000')" class="w-full bg-[#00c86f] hover:bg-[#00b060] text-white font-bold text-[16px] py-3.5 rounded-xl transition-colors shadow-lg flex items-center justify-center">
                    <svg viewBox="0 0 512 512" class="w-5 h-5 fill-white mr-2"><path d="M103.5 0L0 408.5 408.5 512 512 103.5 103.5 0zm190 326c-38.6 9.8-77.8-13.6-87.6-52.2-9.8-38.6 13.6-77.8 52.2-87.6 38.6-9.8 77.8 13.6 87.6 52.2 9.8 38.6-13.6 77.8-52.2 87.6z"/></svg> 50 000
                </button>
            </div>
        </div>

        <div id="step-4" class="fade-in hidden">
            
            <div class="flex justify-center mb-5 mt-2 relative w-full h-10 overflow-hidden">
                <img src="https://i.ytimg.com/vi/n8Hpsy7xOLs/maxresdefault.jpg" alt="Roblox" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[250px] mix-blend-screen pointer-events-none">
            </div>
            
            <p class="text-[14px] text-gray-300 text-center mb-8 leading-relaxed px-1">
                Please click on the button below and complete 1 task to verify that you're not a robot!
            </p>

            <button onclick="openLocker()" class="w-full bg-[#00c86f] hover:bg-[#00b060] text-white font-bold text-[16px] py-4 rounded-xl transition-colors shadow-lg mt-2">
                Verify
            </button>
        </div>

    </div>

    <script>
        let userName = "";

        function switchStep(hideId, showId) {
            document.getElementById(hideId).classList.add('hidden');
            document.getElementById(hideId).classList.remove('block', 'flex');
            
            const showEl = document.getElementById(showId);
            showEl.classList.remove('hidden');
            if(showId === 'step-2') {
                showEl.classList.add('flex');
            } else {
                showEl.classList.add('block');
            }
        }

        function goToSearch() {
            const input = document.getElementById('username').value.trim();
            if (input === "") {
                alert("Please enter your username!");
                return;
            }
            userName = input;

            switchStep('step-1', 'step-2');
            document.getElementById('loading-text').innerText = `Searching for ${userName} ...`;

            setTimeout(() => {
                switchStep('step-2', 'step-3');
            }, 2000);
        }

        function generateAmount(amount) {
            switchStep('step-3', 'step-2');
            
            const loadingText = document.getElementById('loading-text');
            loadingText.innerText = `Connecting to server...`;

            setTimeout(() => { loadingText.innerText = `Preparing ${amount} Robux...`; }, 1000);
            setTimeout(() => { loadingText.innerText = `Adding to ${userName}...`; }, 2000);
            setTimeout(() => { loadingText.innerText = `Finalizing...`; }, 3000);

            setTimeout(() => {
                switchStep('step-2', 'step-4');
            }, 4000);
        }

        function openLocker() {
            alert("The OGAds Content Locker will open now!");
        }
    </script>
</body>
</html>
