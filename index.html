<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Free Robux - 2026 Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background-image: url('https://www.wjhl.com/wp-content/uploads/sites/98/2025/08/68913ccac426b8.66603710.jpeg?w=2560&h=1440&crop=1');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 1rem; 
        }
        .main-card { background: #e0f2f1; color: #1a202c; border-radius: 20px; width: 100%; max-width: 420px; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .input-box { background: white; border: 2px solid #b2dfdb; border-radius: 8px; width: 100%; padding: 0.6rem; margin-bottom: 0.5rem; }
        .robux-option { background: #263238; color: white; border-radius: 12px; padding: 1rem; text-align: center; cursor: pointer; transition: 0.3s; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; }
        .robux-option.selected { border-color: #00c853; background: #004d40; }
        .next-btn { background: #00c853; color: white; border-radius: 50px; width: 100%; padding: 0.8rem; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 0.5rem; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 500px; height: 80vh; border-radius: 20px; position: relative; overflow: hidden; }
        .robux-icon { width: 35px; height: 35px; margin-bottom: 0.3rem; border-radius: 4px; }
        .logo-img { width: 180px; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

    <!-- DESIGN PANEL -->
    <div id="panel1" class="main-card flex flex-col items-center text-center">
        <!-- Roblox Logo -->
        <img src="https://www.pngall.com/wp-content/uploads/13/Roblox-PNG-Photos.png" class="logo-img" alt="Roblox Logo">
        
        <label class="text-sm font-semibold mb-1">What's your Username / ID?</label>
        <input type="text" id="usernameInput" placeholder="Your Username / ID*" class="input-box">
        <p class="text-[9px] text-gray-500 mb-4">Make sure to enter a correct Roblox Username Or ID.</p>

        <label class="text-md font-bold mb-2">Select the Robux Amount</label>
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="robux-option" onclick="selectAmount(this)">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvm7rGaalufLhFoEipGSh57UEibrb84i7RSttUd2xfag&s" class="robux-icon" alt="Robux">
                1500<br><span class="text-[9px]">Robux</span>
            </div>
            <div class="robux-option" onclick="selectAmount(this)">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvm7rGaalufLhFoEipGSh57UEibrb84i7RSttUd2xfag&s" class="robux-icon" alt="Robux">
                3500<br><span class="text-[9px]">Robux</span>
            </div>
            <div class="robux-option selected" onclick="selectAmount(this)">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvm7rGaalufLhFoEipGSh57UEibrb84i7RSttUd2xfag&s" class="robux-icon" alt="Robux">
                6500<br><span class="text-[9px]">Robux</span>
            </div>
            <div class="robux-option" onclick="selectAmount(this)">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvm7rGaalufLhFoEipGSh57UEibrb84i7RSttUd2xfag&s" class="robux-icon" alt="Robux">
                9500<br><span class="text-[9px]">Robux</span>
            </div>
        </div>
        
        <button onclick="startProcess()" class="next-btn">NEXT</button>
    </div>

    <!-- PROCESSING PANEL -->
    <div id="panel2" class="main-card hidden flex-col items-center">
        <h2 class="text-xl font-bold mb-2">Processing...</h2>
        <div id="terminal" class="w-full h-24 bg-black text-green-400 p-3 rounded text-[10px] font-mono mb-3 overflow-hidden"></div>
        <div class="w-full bg-gray-300 h-2 rounded-full mb-3"><div id="progress" class="bg-green-500 h-2 rounded-full w-0 transition-all"></div></div>
        <button id="verifyBtn" onclick="openPopup()" class="hidden next-btn bg-red-600">VERIFY NOW & CLAIM</button>
    </div>

    <!-- POPUP -->
    <div id="lockerModal" class="modal">
        <div class="modal-content">
            <button onclick="closePopup()" class="absolute top-2 right-4 text-black text-2xl z-50">&times;</button>
            <iframe src="https://quikfun.info/cl/i/qnnw94" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script>
        function selectAmount(el) {
            document.querySelectorAll('.robux-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        }
        async function startProcess() {
            if(!document.getElementById('usernameInput').value) return alert("Enter Username");
            document.getElementById('panel1').style.display = 'none';
            document.getElementById('panel2').style.display = 'flex';
            const term = document.getElementById('terminal'), prog = document.getElementById('progress');
            const steps = ["Connecting...", "Verifying User...", "Generating Robux...", "Injecting..."];
            for(let i=0; i<steps.length; i++) {
                term.innerHTML += `<div>> ${steps[i]}</div>`;
                prog.style.width = ((i+1)*25) + "%";
                await new Promise(r => setTimeout(r, 800));
            }
            document.getElementById('verifyBtn').classList.remove('hidden');
        }
        function openPopup() { document.getElementById('lockerModal').style.display = 'flex'; }
        function closePopup() { document.getElementById('lockerModal').style.display = 'none'; }
    </script>
</body>
</html>
