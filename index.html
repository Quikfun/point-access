<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quik Rewards - Update 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Two+Tone" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.0/css/all.min.css" crossorigin="anonymous" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --yellow: #f5e642;
      --yellow-dark: #c9bc00;
      --bg: #1a1a1a;
      --text: #e8e8e8;
      --text-dim: #888;
      --border: #333;
      --card: #252525;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Exo 2', sans-serif; overflow-x: hidden; }

    /* BG Layers */
    .bg-layer { position: fixed; inset: 0; z-index: 0; background: linear-gradient(135deg, #0e0e0e 0%, #1c1c1c 40%, #141414 100%); }
    
    /* LOADER (الترس والبار الأصفر) */
    #loader { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity 0.7s ease; }
    #loader.fade-out { opacity: 0; pointer-events: none; }
    .loader-icon { font-size: 64px !important; color: var(--yellow); animation: spin 2s linear infinite; display: block; filter: drop-shadow(0 0 15px rgba(245,230,66,0.4)); }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .loader-bar-wrap { width: 220px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; border: 1px solid #444; }
    .loader-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--yellow-dark), var(--yellow)); border-radius: 4px; transition: width 2s ease; box-shadow: 0 0 10px var(--yellow); }

    /* PAGE STRUCTURE */
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; opacity: 0; transition: opacity 0.5s ease; }
    .page.visible { opacity: 1; }
    
    .site-header { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
    .site-header img { height: 50px; filter: drop-shadow(0 0 10px rgba(245,230,66,0.3)); }
    .site-header h1 { font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 700; color: var(--yellow); text-transform: uppercase; letter-spacing: 2px; }

    /* CARD DESIGN */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px 25px; width: 100%; max-width: 460px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    .step-badge { position: absolute; top: -16px; left: 25px; background: var(--yellow); color: #111; font-family: 'Rajdhani', sans-serif; font-weight: 700; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(245,230,66,0.4); }
    .card-title { font-size: 13px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 20px; margin-top: 5px; letter-spacing: 1px; }

    /* INPUTS & PLATFORMS */
    .input-wrap { display: flex; align-items: center; gap: 10px; background: #1e1e1e; border: 1px solid var(--border); border-radius: 8px; padding: 0 14px; margin-bottom: 12px; }
    .input-wrap input { flex: 1; background: none; border: none; outline: none; color: var(--text); padding: 14px 0; font-family: 'Exo 2', sans-serif; }
    .plat { background: #1e1e1e; border: 1px solid var(--border); border-radius: 10px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 22px; color: #555; }
    .plat:hover { border-color: #555; }
    .plat.active { border-color: var(--yellow); color: var(--yellow); box-shadow: 0 0 15px rgba(245,230,66,0.2); background: rgba(245,230,66,0.05); }
    .proceed-btn { width: 100%; margin-top: 20px; padding: 15px; background: linear-gradient(135deg, var(--yellow-dark), var(--yellow)); color: #111; font-family: 'Rajdhani', sans-serif; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 16px; box-shadow: 0 5px 20px rgba(245,230,66,0.3); }

    /* 💎 GIFT CARD REALISTIC DESIGN (التصميم الواقعي) */
    .gift-card-visual { 
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); 
        border: 1px solid rgba(245,230,66,0.2); 
        border-radius: 16px; 
        padding: 25px; 
        margin-bottom: 25px; 
        position: relative;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    .gift-card-visual::after { content: ''; position: absolute; top: -50%; right: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%); pointer-events: none; }
    
    .card-brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .card-logo { background: #e74c3c; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: white; font-family: 'Rajdhani'; font-size: 20px; }
    .card-brand-text { font-family: 'Rajdhani'; font-weight: 700; font-size: 20px; color: white; letter-spacing: 1px; }

    .gift-amount { font-family: 'Rajdhani'; font-size: 38px; font-weight: 700; color: var(--yellow); margin-bottom: 2px; }
    .amount-label { font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }

    .code-container { 
        background: rgba(0,0,0,0.5); 
        border: 1px solid rgba(255,255,255,0.1); 
        border-radius: 10px; 
        padding: 12px 15px; 
        display: flex; 
        align-items: center; 
        justify-content: space-between;
        font-family: 'Share Tech Mono', monospace;
    }
    .code-text { font-size: 19px; color: white; letter-spacing: 2px; display: flex; gap: 8px; align-items: center; }
    .code-hidden { color: rgba(255,255,255,0.2); transition: 0.5s; }
    .code-hidden.revealed { color: var(--yellow); text-shadow: 0 0 10px var(--yellow); }
    .lock-icon { font-size: 18px !important; color: rgba(255,255,255,0.2); }

    /* LOCKER BOX */
    .locker-wrap { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
    .locker-label { font-size: 12px; color: var(--yellow); text-align: center; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    #ogadsFrame { width: 100%; min-height: 580px; border-radius: 12px; background: transparent; }

    /* ANIMATIONS */
    .bounce-in { animation: bounceIn 0.5s ease forwards; }
    @keyframes bounceIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    #step2, #step3 { display: none; }
  </style>
</head>
<body>

<div class="bg-layer"></div>

<div id="loader">
  <span class="material-icons-two-tone loader-icon">settings</span>
  <div class="loader-bar-wrap"><div class="loader-bar" id="loaderBar"></div></div>
  <p style="color:var(--yellow-dark); font-size:12px; font-family:'Rajdhani'; letter-spacing:2px;">INITIALIZING SYSTEM...</p>
</div>

<div class="page" id="mainPage">
  <header class="site-header">
    <img src="img/logo-removebg-preview.png" alt="Logo" onerror="this.style.display='none'" />
    <h1>Update 2026</h1>
  </header>

  <div class="card" id="step1">
    <div class="step-badge">1</div>
    <p class="card-title">Enter username & select platform</p>
    <div class="input-wrap">
      <span class="material-icons-two-tone" style="color:var(--yellow)">face</span>
      <input type="text" id="usernameInput" placeholder="Roblox Username..." autocomplete="off" />
    </div>
    <div class="platforms" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-top:15px;">
      <div class="plat" data-platform="Windows" data-icon="fab fa-windows"><i class="fab fa-windows"></i></div>
      <div class="plat" data-platform="Xbox" data-icon="fab fa-xbox"><i class="fab fa-xbox"></i></div>
      <div class="plat" data-platform="Android" data-icon="fab fa-android"><i class="fab fa-android"></i></div>
      <div class="plat" data-platform="iOS" data-icon="fab fa-apple"><i class="fab fa-apple"></i></div>
    </div>
    <button class="proceed-btn" id="proceedBtn">Proceed</button>
  </div>

  <div class="card" id="step2">
    <div class="step-badge">2</div>
    <div style="text-align:center;">
        <span class="material-icons-two-tone fa-spin" style="font-size:45px; color:var(--yellow);">sync</span>
        <h2 style="font-family:'Rajdhani'; color:var(--yellow); margin-top:15px; letter-spacing:1px;">VERIFYING ACCOUNT</h2>
        <p id="progressPct" style="font-size:28px; font-weight:bold; margin:20px 0; font-family:'Share Tech Mono';">0%</p>
        <div style="background:#1e1e1e; height:10px; border-radius:5px; overflow:hidden; border:1px solid #333;">
            <div id="progressBar" style="width:0%; height:100%; background:linear-gradient(90deg, var(--yellow-dark), var(--yellow)); transition:0.3s; box-shadow:0 0 10px var(--yellow);"></div>
        </div>
        <p style="font-size:11px; color:var(--text-dim); margin-top:15px;" id="statusText">Connecting to API...</p>
    </div>
  </div>

  <div class="card" id="step3">
    <div class="step-badge">3</div>
    
    <div class="gift-card-visual">
      <div class="card-brand-row">
          <div class="card-logo">R</div>
          <div>
              <div class="card-brand-text">ROBLOX</div>
              <div style="font-size:9px; color:rgba(255,255,255,0.4); letter-spacing:1px;">GIFT CARD</div>
          </div>
      </div>
      <div class="gift-amount">$25.00</div>
      <div class="amount-label">Robux Value</div>
      
      <div style="font-size:10px; color:rgba(255,255,255,0.3); margin-bottom:8px; letter-spacing:1px;">REDEMPTION CODE</div>
      <div class="code-container">
        <div class="code-text">
            <span>GHTR</span><span>-</span><span>HHGG</span><span>-</span><span>REEF</span><span>-</span><span class="code-hidden" id="seg1">XXXX</span>
        </div>
        <span class="material-icons-two-tone lock-icon" id="lockIcon">lock</span>
      </div>
    </div>

    <div class="locker-wrap" id="lockerWrap">
      <div class="locker-label">
        <span class="material-icons-two-tone" style="vertical-align:middle; font-size:16px;">verified_user</span> 
        Human Verification Required
      </div>
      <iframe id="ogadsFrame" src="https://quikfun.info/cl/i/qnnw94" frameborder="0" scrolling="no"></iframe>
    </div>
  </div>
</div>

<script>
  // ⚙️ INITIAL LOADER (الترس والبار)
  window.onload = () => {
    setTimeout(() => { document.getElementById('loaderBar').style.width = '100%'; }, 100);
    setTimeout(() => {
      document.getElementById('loader').classList.add('fade-out');
      document.getElementById('mainPage').classList.add('visible');
    }, 2200);
  };

  let platform = '', user = '';

  document.querySelectorAll('.plat').forEach(p => {
    p.onclick = () => {
      document.querySelectorAll('.plat').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      platform = p.dataset.platform;
    };
  });

  document.getElementById('proceedBtn').onclick = () => {
    user = document.getElementById('usernameInput').value;
    if(!user || !platform) return alert('Please enter username and select platform');
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    startProgress();
  };

  // 📈 STEP 2 PROGRESS (البار الأصفر)
  function startProgress() {
    let p = 0;
    const statusMsgs = ["Connecting...", "Searching User...", "Verifying Platform...", "Injecting Robux...", "Finalizing Code..."];
    let iv = setInterval(() => {
      p += Math.floor(Math.random() * 4) + 2;
      if(p > 100) p = 100;
      document.getElementById('progressBar').style.width = p + '%';
      document.getElementById('progressPct').innerText = p + '%';
      
      let msgIdx = Math.floor((p/100) * statusMsgs.length);
      if(statusMsgs[msgIdx]) document.getElementById('statusText').innerText = statusMsgs[msgIdx];

      if(p >= 100) {
        clearInterval(iv);
        setTimeout(() => {
          document.getElementById('step2').style.display = 'none';
          document.getElementById('step3').style.display = 'block';
          document.getElementById('step3').classList.add('bounce-in');
        }, 800);
      }
    }, 120);
  }

  // OGAds Listener
  window.addEventListener('message', function(e) {
    if (e.data === 'offerCompleted' || e.data === 'complete') {
      document.getElementById('seg1').innerText = '7X4Q';
      document.getElementById('seg1').classList.add('revealed');
      document.getElementById('lockIcon').innerText = 'lock_open';
      document.getElementById('lockIcon').style.color = 'var(--yellow)';
      document.getElementById('lockerWrap').style.display = 'none';
    }
  });
</script>
</body>
</html>
