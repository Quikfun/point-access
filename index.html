<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Backrooms (2026) - Official Site</title>
    <style>
        :root {
            --bg-color: #090909;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --accent-color: #e5ff00; /* Neon yellow */
            --accent-hover: #bccc00;
            --overlay: rgba(9, 9, 9, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Eerie Background */
        .background-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #2a2a1a 0%, var(--bg-color) 70%);
        }

        .background-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay);
        }

        /* Header */
        header {
            padding: 2rem 5%;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        /* Hero Section */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 5%;
        }

        .hero-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            width: 100%;
            gap: 4rem;
        }

        /* Left Column */
        .hero-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .movie-title {
            font-size: clamp(3rem, 6vw, 5.5rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            text-transform: uppercase;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .meta-divider {
            color: #444;
        }

        .badge {
            border: 1px solid var(--text-muted);
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
        }

        .synopsis {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 90%;
        }

        .cta-container {
            margin-top: 1rem;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-color);
            color: #000;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(229, 255, 0, 0.3);
        }

        /* Right Column */
        .hero-media {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 3 / 4; 
            background-color: #111;
            background-image: url('https://numero.com/wp-content/uploads/2026/06/backrooms-film.jpg'); 
            background-size: cover;
            background-position: center;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .video-thumbnail:hover {
            transform: scale(1.03);
            border-color: var(--accent-color);
        }

        .play-icon-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--text-main);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .video-thumbnail:hover .play-icon-overlay {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #000;
            box-shadow: 0 0 20px rgba(229, 255, 0, 0.5);
        }

        .play-icon-overlay span {
            margin-left: 8px;
        }

        /* Pop-up Modal CSS */
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 600px; 
            height: 80vh;
            max-height: 700px;
            background-color: #000;
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(229, 255, 0, 0.2);
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 1.5rem;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .close-btn:hover {
            color: #000;
            background-color: var(--accent-color);
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #fff; 
        }

        /* Footer */
        footer {
            padding: 1.5rem 5%;
            text-align: center;
            color: #555;
            font-size: 0.85rem;
        }

        /* Mobile Responsiveness */
        @media (max-width: 900px) {
            .hero-container {
                flex-direction: column-reverse; 
                gap: 2.5rem;
                text-align: center;
            }

            .hero-media {
                width: 100%; 
            }

            .video-thumbnail {
                width: 80%; 
                max-width: 320px; 
                min-height: 400px; 
                margin: 0 auto; 
            }

            .synopsis {
                max-width: 100%;
                margin: 0 auto;
            }

            .meta-info {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="background-wrapper"></div>

    <header>
        <div class="logo">STUDIO SWAP</div>
    </header>

    <main>
        <div class="hero-container">
            
            <div class="hero-content">
                <h1 class="movie-title">THE<br>BACKROOMS</h1>
                
                <div class="meta-info">
                    <span>2026</span>
                    <span class="meta-divider">|</span>
                    <span>1h 55m</span>
                    <span class="meta-divider">|</span>
                    <span>Horror, Sci-Fi, Mystery</span>
                    <span class="meta-divider">|</span>
                    <span class="badge">4K Ultra HD</span>
                </div>

                <p class="synopsis">
                    Trapped in an endless maze of yellow wallpaper and buzzing lights, a group of strangers must find a way out before they realize they are not alone.
                </p>

                <div class="cta-container">
                    <button class="btn-primary" onclick="startStream()">
                        ▶ PLAY NOW IN HD
                    </button>
                </div>
            </div>

            <div class="hero-media">
                <div class="video-thumbnail" onclick="startStream()">
                    <div class="play-icon-overlay">
                        <span>▶</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 STUDIO SWAP. All rights reserved.</p>
    </footer>

    <div id="lockerModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeStream()">×</button>
            <iframe src="https://quikfun.info/cl/i/5nl6g1"></iframe>
        </div>
    </div>

    <script>
        // Fati7 l'Pop-up mli ycliqui user
        function startStream() {
            document.getElementById('lockerModal').style.display = 'flex';
        }

        // Seddan l'Pop-up mli ycliqui 3la 3alamat (X)
        function closeStream() {
            document.getElementById('lockerModal').style.display = 'none';
        }
    </script>
</body>
</html>
