<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW4 - Secure Beta Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            background-image: linear-gradient(rgba(11, 14, 20, 0.85), rgba(11, 14, 20, 0.95)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Force OgAds links to be white */
        .og_offers a, .offer-list a, .og-offer-text, .og-offer-title, a { 
            color: #ffffff !important; 
            text-decoration: none !important; 
        }

        header { width: 100%; padding: 20px; text-align: center; background: rgba(16, 22, 32, 0.9); border-bottom: 3px solid #ff4e00; }
        header h1 { font-size: 1.8rem; text-transform: uppercase; color: #ff4e00; }
        
        .container { max-width: 600px; width: 90%; margin: 40px auto; background: rgba(16, 22, 32, 0.95); border: 1px solid #2a3447; border-radius: 8px; padding: 30px; text-align: center; }
        .action-btn { width: 100%; background: linear-gradient(135deg, #ff4e00, #ec4899); color: white; border: none; padding: 18px; font-size: 1.2rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        
        .generator-console { display: none; background: #020617; border: 1px solid #1e293b; padding: 20px; margin-top: 20px; text-align: left; font-family: monospace; font-size: 0.85rem; color: #38bdf8; }
        .progress-container { display: none; width: 100%; background-color: #1e293b; height: 12px; margin: 20px 0; border-radius: 10px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff4e00, #38bdf8); }
        .verification-box { display: none; background: rgba(30, 41, 59, 0.5); border: 2px solid #f43f5e; padding: 20px; margin-top: 20px; }
        .verify-btn { background: #f43f5e; color: white; border: none; padding: 12px 25px; font-size: 1rem; cursor: pointer; margin-top: 15px; }
    </style>

    <!-- OGADS SCRIPT -->
    <script type="text/javascript" id="ogjs" src="https://quikfun.info/cl/js/o4epoq"></script>
</head>
<body>

    <header><h1>Modern Warfare <span>IV</span> Beta</h1></header>

    <div class="container">
        <div id="setup-area">
            <button class="action-btn" onclick="startGeneration()">Generate Beta Key</button>
        </div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="generator-console" id="generator-console"></div>

        <div class="verification-box" id="verification-box">
            <h3>Anti-Bot Verification Required</h3>
            <button class="verify-btn" onclick="callOgadsLocker()">Verify Now</button>
        </div>
    </div>

    <script>
        // Force color update every 500ms
        setInterval(function() {
            var elements = document.querySelectorAll('a, .og-offer-text, .og-offer-title, .og-offer-description');
            for (var i = 0; i < elements.length; i++) {
                elements[i].style.color = '#ffffff';
            }
        }, 500);

        function startGeneration() {
            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('generator-console').style.display = 'block';

            const consoleEl = document.getElementById('generator-console');
            const progressBar = document.getElementById('progress-bar');
            let progress = 0;

            const interval = setInterval(() => {
                if (progress < 100) {
                    progress += 2;
                    progressBar.style.width = progress + '%';
                } else {
                    clearInterval(interval);
                    document.getElementById('verification-box').style.display = 'block';
                }
            }, 60);
        }

        function callOgadsLocker() {
            if (typeof og_load === 'function') { og_load(); } 
        }
    </script>
</body>
</html>
